<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵星奇缘 · 打击感升级演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1d29; color: #e8e8f0; font-family: -apple-system, "PingFang SC", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #8a8fa3; margin-bottom: 14px; }
  canvas { background: linear-gradient(180deg, #7ec8a0 0%, #6ab88e 100%); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45); touch-action: none; }
  .bar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  button { padding: 10px 22px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; }
  .b1 { background: #e8506a; } .b2 { background: #e6a817; } .b3 { background: #8a5cf5; } .b4 { background: #3aa0e8; }
  .legend { margin-top: 12px; font-size: 12px; color: #a8adc0; max-width: 640px; line-height: 1.8; }
  .legend b { color: #e8e8f0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: #2a2e40; margin: 0 2px; }
</style>
</head>
<body>
<h1>打击感升级 · 手感演示</h1>
<div class="sub">点击画面任意处 = 普攻命中；按钮切换反馈等级（与游戏内参数一致）</div>
<canvas id="cv" width="640" height="420"></canvas>
<div class="bar">
  <button class="b1" onclick="hit(0)">普攻（顿帧60ms/震3px）</button>
  <button class="b2" onclick="hit(1)">暴击（90ms/震6px/白闪）</button>
  <button class="b3" onclick="hit(2)">击杀（130ms/震9px/强白闪）</button>
  <button class="b4" onclick="autoCombo()">连击演示</button>
</div>
<div class="legend">
  本页复刻游戏内 <span class="tag">field-battle-system</span> 的新参数：<b>①</b> 顿帧三档 0.06/0.09/0.13s（画面凝滞、数字同步冻结）；<b>②</b> 方向性震屏（画面朝击退方向窜）+ 指数衰减；<b>③</b> 怪物受击挤压变形（横向胀 13%、纵向压 10%，约 0.1s 回弹）；<b>④</b> 伤害数字：抛物线运动 + 横向错位 + easeOutBack 弹性 pop + 深色描边 + 两段式淡出（前 55% 不透明）；<b>⑤</b> 暴击金色大字 1.45 倍 + 暖棕描边 + 全屏 12% 白闪。
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let state = {
  hitStop: 0, shake: 0, shakeDirX: 0, shakeDirY: 0, critFlash: 0,
  monster: { x: W/2, y: H/2 + 30, hp: 100, maxHp: 100, squash: 0 },
  texts: [], attacker: null
};
function hit(level) {
  const m = state.monster;
  state.attacker = { x: m.x - 150 - Math.random()*60, y: m.y + 60 - Math.random()*120 };
  const killed = level === 2 || m.hp <= 0;
  const crit = level >= 1;
  state.hitStop = killed ? 0.13 : (crit ? 0.09 : 0.06);
  state.shake = (killed ? 9 : crit ? 6 : 3) * 2;
  const dx = m.x - state.attacker.x, dy = m.y - state.attacker.y, L = Math.hypot(dx,dy);
  state.shakeDirX = dx/L; state.shakeDirY = dy/L;
  state.critFlash = killed ? 1 : crit ? 0.7 : 0;
  m.squash = 1;
  m.hp = Math.max(0, m.hp - (killed ? m.hp : 10 + Math.floor(Math.random()*20)));
  const dmg = killed ? 999 : 10 + Math.floor(Math.random()*20);
  state.texts.push({
    text: killed ? `-${dmg}!` : `-${dmg}${crit?'!':''}`,
    x: m.x + (Math.random()*2-1)*14, y: m.y - 40,
    vx: (Math.random()*2-1)*26, vy: -(crit?190:150)*(0.9+Math.random()*0.2),
    g: (crit?430:380), life: 1.0, maxLife: 1.0, isCrit: crit
  });
  if (m.hp <= 0) setTimeout(() => { m.hp = m.maxHp; }, 900);
}
let autoTimer = null;
function autoCombo() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; return; }
  let n = 0;
  autoTimer = setInterval(() => {
    hit(n % 5 === 4 ? 1 : 0); n++;
    if (n >= 10) { clearInterval(autoTimer); autoTimer = null; }
  }, 240);
}
let last = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  const frozen = state.hitStop > 0;
  if (frozen) state.hitStop = Math.max(0, state.hitStop - dt);
  if (state.shake > 0) { state.shake *= Math.exp(-dt*10); if (state.shake < 0.5) state.shake = 0; }
  if (state.critFlash > 0) state.critFlash = Math.max(0, state.critFlash - dt*6);
  const m = state.monster;
  if (m.squash > 0) m.squash = Math.max(0, m.squash - dt*5.5);
  if (!frozen) for (let i = state.texts.length-1; i >= 0; i--) {
    const t = state.texts[i];
    const prog = 1 - t.life/t.maxLife;
    if (t.vy == null) { t.vy = -150; t.vx = (Math.random()*2-1)*26; t.g = 380; }
    t.vy += t.g*dt; t.y += t.vy*dt; t.x += t.vx*dt; t.vx *= Math.exp(-dt*3);
    const popT = Math.min(1, prog/0.18), c1 = 1.70158, c3 = c1+1;
    const pop = 1 + c3*Math.pow(popT-1,3) + c1*Math.pow(popT-1,2);
    const base = t.isCrit ? 1.45 : 1.0;
    t._scale = base*1.35 + (base - base*1.35)*pop;
    t._alpha = prog < 0.55 ? 1 : Math.max(0, 1-(prog-0.55)/0.45);
    t.life -= dt;
    if (t.life <= 0) state.texts.splice(i,1);
  }
  // 渲染
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (state.shake > 0) ctx.translate(
    (Math.random()-0.5)*2*state.shake + state.shakeDirX*state.shake*0.6,
    (Math.random()-0.5)*2*state.shake + state.shakeDirY*state.shake*0.6);
  // 地面草点
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  for (let i=0;i<40;i++){ const gx=(i*137)%W, gy=(i*211)%H; ctx.fillRect(gx,gy,3,3); }
  // 攻击者（小猫 = 圆+耳）
  if (state.attacker) {
    ctx.fillStyle = '#f5c66a';
    ctx.beginPath(); ctx.arc(state.attacker.x, state.attacker.y, 20, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(state.attacker.x-16,state.attacker.y-12); ctx.lineTo(state.attacker.x-6,state.attacker.y-26); ctx.lineTo(state.attacker.x-2,state.attacker.y-12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(state.attacker.x+16,state.attacker.y-12); ctx.lineTo(state.attacker.x+6,state.attacker.y-26); ctx.lineTo(state.attacker.x+2,state.attacker.y-12); ctx.fill();
  }
  // 怪物（史莱姆猫）+ 挤压
  const sq = m.squash > 0.5 ? (m.squash-0.5)/0.5 : 0;
  ctx.save(); ctx.translate(m.x, m.y); ctx.scale(1+0.13*sq, 1-0.10*sq);
  ctx.fillStyle = '#9b7fe8';
  ctx.beginPath(); ctx.ellipse(0, 0, 46, 44, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30,-32); ctx.lineTo(-20,-56); ctx.lineTo(-10,-34); ctx.fill();
  ctx.beginPath(); ctx.moveTo(30,-32); ctx.lineTo(20,-56); ctx.lineTo(10,-34); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-14,-8,7,9,0,0,7); ctx.ellipse(14,-8,7,9,0,0,7); ctx.fill();
  ctx.fillStyle = '#333';
  const blink = Math.sin(now/300) > 0.96;
  if (!blink) { ctx.beginPath(); ctx.arc(-13,-7,3.4,0,7); ctx.arc(15,-7,3.4,0,7); ctx.fill(); }
  ctx.restore();
  // 受击闪白
  if (m.squash > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(0.85, m.squash*0.9);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(m.x, m.y-6, 48, 46, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  // 血条
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(m.x-52, m.y-78, 104, 10);
  ctx.fillStyle = '#5dd879'; ctx.fillRect(m.x-50, m.y-76, 100*(m.hp/m.maxHp), 6);
  ctx.restore();
  // 全屏白闪
  if (state.critFlash > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(0.12, state.critFlash*0.12);
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  // 伤害数字
  for (const t of state.texts) {
    ctx.save(); ctx.globalAlpha = t._alpha;
    ctx.font = `bold ${(t.isCrit?23:16) * t._scale}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 3.5 * t._scale;
    ctx.strokeStyle = t.isCrit ? 'rgba(122,53,0,0.95)' : 'rgba(20,10,10,0.75)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.isCrit ? '#FFD700' : '#ff4757';
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
  // 冻结提示
  if (frozen) {
    ctx.save(); ctx.globalAlpha = 0.7; ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⏸ HIT-STOP ' + (state.hitStop*1000).toFixed(0) + 'ms', W/2, 30); ctx.restore();
  }
  requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown', () => hit(0));
requestAnimationFrame(loop);
</script>
</body>
</html>
