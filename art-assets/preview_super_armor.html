<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霸体技能光环特效预览</title>
<style>
  html,body{margin:0;background:#1a1d2e;color:#eee;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  h2{font-weight:600;margin:18px 0 6px;font-size:18px;}
  .wrap{display:flex;gap:24px;flex-wrap:wrap;padding:16px 24px;}
  .card{background:#222637;border-radius:12px;padding:12px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.4);}
  canvas{display:block;background:radial-gradient(circle at 50% 60%, #2c3350 0%, #161a2b 70%);border-radius:8px;}
  .tip{color:#9aa3c0;font-size:12px;margin-top:8px;}
  .toolbar{padding:0 24px 24px;color:#9aa3c0;font-size:13px;}
  button{background:#3a4470;color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;margin-right:8px;}
</style>
</head>
<body>
<h2>霸体(superArmor)技能光环特效预览</h2>
<div class="wrap">
  <div class="card"><canvas id="hero" width="260" height="320"></canvas><div class="tip">英雄 · 金色（玩家/AI 队友）</div></div>
  <div class="card"><canvas id="mon" width="260" height="320"></canvas><div class="tip">怪物 · 红色（敌方霸体大招）</div></div>
</div>
<div class="toolbar">特效元素：全身柔光 + 脚底旋转双环 + 身体周围旋转护盾碎片 + 头顶「霸体」盾牌标记。施法结束自动熄灭（与 playerAnim / isCastingSkill 对齐）。</div>

<script>
// 与 field-scene.js 中 _renderSuperArmorAura 完全一致的绘制逻辑（仅坐标缩放适配预览）
function drawAura(ctx, screenX, screenY, isMonster, t) {
  const dpr = 1
  const pulse = 0.5 + 0.5 * Math.sin(t * 6)
  const bodyH = 90 * dpr
  const cx = screenX, feetY = screenY, cy = screenY - bodyH * 0.5
  const main = isMonster ? '255,72,72' : '255,196,64'
  const sub  = isMonster ? '255,150,96' : '77,208,225'
  ctx.save()
  ctx.globalCompositeOperation = 'lighter'
  const glowR = bodyH * 0.9
  const grad = ctx.createRadialGradient(cx, cy, glowR * 0.1, cx, cy, glowR)
  grad.addColorStop(0, 'rgba(' + main + ',' + (0.10 + 0.10 * pulse) + ')')
  grad.addColorStop(0.7, 'rgba(' + main + ',' + (0.05 + 0.05 * pulse) + ')')
  grad.addColorStop(1, 'rgba(' + main + ',0)')
  ctx.fillStyle = grad
  ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, Math.PI * 2); ctx.fill()
  for (let ring = 0; ring < 2; ring++) {
    const dir = ring === 0 ? 1 : -1
    const rr = (34 + ring * 6) * dpr * (0.95 + 0.05 * pulse)
    ctx.save(); ctx.translate(cx, feetY); ctx.scale(1, 0.34)
    ctx.strokeStyle = 'rgba(' + main + ',' + (0.55 + 0.3 * (ring === 0 ? pulse : 1 - pulse)) + ')'
    ctx.lineWidth = (3 - ring) * dpr
    ctx.beginPath()
    ctx.arc(0, 0, rr, t * dir * 2 + (ring ? Math.PI : 0), t * dir * 2 + (ring ? Math.PI : 0) + Math.PI * 1.4)
    ctx.stroke(); ctx.restore()
  }
  const shards = 6
  for (let i = 0; i < shards; i++) {
    const ang = t * 1.6 + (Math.PI * 2 * i) / shards
    const orbit = (bodyH * 0.55) * (0.9 + 0.1 * Math.sin(t * 3 + i))
    const px = cx + Math.cos(ang) * orbit, py = cy + Math.sin(ang) * orbit * 0.5
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang + t)
    ctx.fillStyle = 'rgba(' + sub + ',' + (0.5 + 0.4 * pulse) + ')'
    ctx.beginPath(); ctx.moveTo(0, -5 * dpr); ctx.lineTo(4 * dpr, 0); ctx.lineTo(0, 5 * dpr); ctx.lineTo(-4 * dpr, 0); ctx.closePath(); ctx.fill()
    ctx.restore()
  }
  const labelY = screenY - bodyH - 16 * dpr
  ctx.save(); ctx.translate(cx, labelY)
  ctx.fillStyle = 'rgba(' + main + ',0.85)'; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5 * dpr
  const s = 9 * dpr
  ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s, -s * 0.5); ctx.lineTo(s, s * 0.3)
  ctx.quadraticCurveTo(s, s, 0, s * 1.4); ctx.quadraticCurveTo(-s, s, -s, s * 0.3); ctx.lineTo(-s, -s * 0.5); ctx.closePath()
  ctx.fill(); ctx.stroke(); ctx.restore()
  ctx.font = 'bold ' + (12 * dpr) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillStyle = 'rgba(' + main + ',0.95)'; ctx.fillText('霸体', cx, labelY - 16 * dpr)
  ctx.restore()
}
function drawChar(ctx, x, y, color) {
  ctx.save(); ctx.fillStyle = color; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.ellipse(x, y, 16, 22, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke()
  ctx.fillStyle = '#ffe'; ctx.beginPath(); ctx.arc(x, y-26, 9, 0, Math.PI*2); ctx.fill()
  ctx.restore()
}
function frame(ts) {
  const t = ts / 1000
  const hc = document.getElementById('hero').getContext('2d')
  hc.clearRect(0,0,260,320); drawChar(hc,130,210,'#7ec8ff'); drawAura(hc,130,210,false,t)
  const mc = document.getElementById('mon').getContext('2d')
  mc.clearRect(0,0,260,320); drawChar(mc,130,210,'#ff7e7e'); drawAura(mc,130,210,true,t)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
