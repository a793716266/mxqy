<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图编辑器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#1a1a2e;color:#e0e0e0;overflow:hidden;height:100vh;user-select:none}
#toolbar{height:48px;background:linear-gradient(135deg,#16213e,#0f3460);display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:2px solid #e94560;z-index:100}
#toolbar h1{font-size:16px;color:#e94560;margin-right:15px;white-space:nowrap}
.tool-sep{width:1px;height:30px;background:#333;margin:0 5px}
.tool-btn{padding:5px 10px;background:#2a2a4a;border:1px solid #444;color:#ccc;border-radius:4px;cursor:pointer;font-size:12px;transition:all 0.2s;white-space:nowrap}
.tool-btn:hover{background:#3a3a5a;color:#fff;border-color:#666}
.tool-btn.active{background:#e94560;color:#fff;border-color:#e94560}
.tool-btn.primary{border-color:#e94560;color:#e94560}
.tool-btn.primary:hover{background:#e94560;color:#fff}
#main-container{display:flex;height:calc(100vh - 48px)}
#left-panel{width:220px;background:#16213e;border-right:2px solid #333;display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:8px 10px;background:#0f3460;font-size:13px;color:#e94560;font-weight:bold}
#asset-tabs{display:flex;padding:5px;gap:3px;background:#1a1a2e}
.asset-tab{flex:1;padding:4px 2px;background:#2a2a4a;border:none;color:#999;cursor:pointer;border-radius:3px;font-size:11px}
.asset-tab:hover{background:#3a3a5a;color:#ccc}
.asset-tab.active{background:#e94560;color:#fff}
#asset-list{flex:1;overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start}
.asset-item{background:#2a2a4a;border:2px solid transparent;border-radius:6px;padding:6px;cursor:pointer;text-align:center;transition:all 0.2s}
.asset-item:hover{border-color:#e94560;background:#3a3a5a}
.asset-item.selected{border-color:#e94560;background:#e94560}
.asset-item .thumb{width:80px;height:80px;object-fit:contain;image-rendering:pixelated;display:block;margin:0 auto}
.asset-item .asset-name{font-size:10px;margin-top:4px;color:#aaa;word-break:break-all}
.asset-item.selected .asset-name{color:#fff}
#canvas-area{flex:1;position:relative;overflow:hidden;background:#0a0a1a}
#main-canvas{position:absolute;top:0;left:0;z-index:1}
#overlay-canvas{position:absolute;top:0;left:0;z-index:2;cursor:crosshair}
#coord-display{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.8);padding:6px 12px;border-radius:4px;font-size:12px;color:#0f0;z-index:10;font-family:'Courier New',monospace}
#minimap-container{position:absolute;bottom:10px;right:10px;width:200px;height:150px;background:rgba(0,0,0,0.8);border:2px solid #444;border-radius:4px;overflow:hidden;z-index:10;cursor:pointer}
#minimap-canvas{width:100%;height:100%}
#minimap-viewport{position:absolute;border:2px solid #e94560;background:rgba(233,69,96,0.1);pointer-events:none;z-index:11}
#zoom-controls{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.8);padding:5px 8px;border-radius:4px;display:flex;align-items:center;gap:5px;z-index:10}
#zoom-controls button{width:24px;height:24px;background:#2a2a4a;border:1px solid #444;color:#ccc;border-radius:3px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
#zoom-controls button:hover{background:#3a3a5a;color:#fff;border-color:#666}
#zoom-level{color:#0f0;font-size:11px;min-width:40px;text-align:center;font-family:'Courier New',monospace}
#right-panel{width:260px;background:#16213e;border-left:2px solid #333;overflow-y:auto}
.prop-group{padding:10px;border-bottom:1px solid #2a2a4a}
.prop-group-title{font-size:12px;color:#e94560;margin-bottom:8px;font-weight:bold}
.prop-row{display:flex;align-items:center;margin-bottom:5px;gap:6px}
.prop-row label{width:70px;font-size:11px;color:#aaa;flex-shrink:0;text-align:right}
.prop-row input,.prop-row select{flex:1;padding:3px 6px;background:#2a2a4a;border:1px solid #444;border-radius:3px;color:#e0e0e0;font-size:12px;min-width:0}
/* 对话框样式 */
.dialog-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center}
.dialog-box{background:#16213e;border:2px solid #e94560;border-radius:8px;padding:20px;min-width:350px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
.dialog-box h2{color:#e94560;font-size:16px;margin-bottom:15px;text-align:center}
.dialog-row{display:flex;align-items:center;margin-bottom:10px;gap:8px}
.dialog-row label{width:80px;font-size:12px;color:#aaa;text-align:right;flex-shrink:0}
.dialog-row input,.dialog-row select{flex:1;padding:6px 10px;background:#2a2a4a;border:1px solid #444;border-radius:4px;color:#e0e0e0;font-size:13px}
.dialog-btns{display:flex;justify-content:center;gap:10px;margin-top:18px}
.dialog-btns button{padding:8px 24px;border-radius:4px;cursor:pointer;font-size:13px;border:1px solid}
.dialog-ok{background:#e94560;color:#fff;border-color:#e94560}
.dialog-ok:hover{background:#c73a52}
.dialog-cancel{background:#2a2a4a;color:#ccc;border-color:#444}
.dialog-cancel:hover{background:#3a3a5a;color:#fff}

/* 画笔设置面板 */
.brush-panel{background:#1a1a2e;border-bottom:2px solid #e94560;padding:6px 8px;display:none;align-items:center;gap:8px}
.brush-panel.active{display:flex}
.brush-label{font-size:11px;color:#e94560;font-weight:bold;white-space:nowrap}
.brush-inline-select{flex:1;padding:3px 6px;background:#2a2a4a;border:1px solid #444;border-radius:3px;color:#e0e0e0;font-size:11px}
.brush-tile-size{width:50px;padding:3px 6px;background:#2a2a4a;border:1px solid #444;border-radius:3px;color:#e0e0e0;font-size:11px;text-align:center}
.brush-tile-size-label{font-size:10px;color:#888}
/* 画笔预览高亮 */
.brush-preview-cell{outline:2px dashed #0ff;outline-offset:-2px;pointer-events:none}
</style>
</head>
<body>

<div id="toolbar">
  <h1>地图编辑器</h1>
  <button class="tool-btn primary" onclick="Editor.newMapDialog()">新建</button>
  <button class="tool-btn primary" onclick="document.getElementById('file-input').click()">打开JS文件</button>
  <input type="file" id="file-input" accept=".js" style="display:none" onchange="Editor.loadJSFile(this)">
  <button class="tool-btn primary" onclick="Editor.exportJS()">导出JS</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="btn-select" onclick="Editor.setTool('select')">选择(S)</button>
  <button class="tool-btn" id="btn-place" onclick="Editor.setTool('place')">放置(P)</button>
  <button class="tool-btn" id="btn-brush" onclick="Editor.setTool('brush')">画笔(B)</button>
  <button class="tool-btn" id="btn-delete" onclick="Editor.setTool('delete')">删除(D)</button>
  <div class="tool-sep"></div>
  <label style="color:#888;font-size:11px;margin:0 5px;">网格:</label>
  <input type="checkbox" id="grid-toggle" checked onchange="Editor.toggleGrid()" style="width:14px;height:14px;">
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="Editor.undo()">撤销</button>
  <button class="tool-btn" onclick="Editor.redo()">重做</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="Editor.rescanAssets()" title="重新扫描素材目录">🔄 重新扫描素材</button>
  <div class="tool-sep"></div>
  <button class="tool-btn" onclick="Editor.fillBackgroundDialog()" title="用选定素材填充整个地图背景" style="background:#2d8a4e;border-color:#3ea56a;">🌾 填充背景</button>
</div>

<!-- 画笔设置面板 -->
<div id="brush-panel" class="brush-panel">
  <span class="brush-label">🖌️ 画笔</span>
  <label class="brush-tile-size-label">素材:</label>
  <select id="brush-asset-select" class="brush-inline-select" onchange="onBrushAssetChange()"></select>
  <label class="brush-tile-size-label">网格:</label>
  <input type="number" id="brush-tile-size" class="brush-tile-size" value="128" min="32" max="512" onchange="onBrushTileChange()" title="每个瓦片的像素大小">
  <label style="font-size:10px;color:#888;display:flex;align-items:center;gap:3px;">
    <input type="checkbox" id="brush-auto-tile" checked onchange="onBrushAutoTileChange()"> 自动拼接
  </label>
  <span style="font-size:10px;color:#666;flex:1;text-align:right;">拖拽绘制 · 边缘自动对齐</span>
</div>

<div id="main-container">
  <div id="left-panel">
    <div class="panel-header">素材库</div>
    <div id="asset-tabs">
      <button class="asset-tab active" data-cat="all">全部</button>
      <button class="asset-tab" data-cat="building">建筑</button>
      <button class="asset-tab" data-cat="obstacle">障碍</button>
      <button class="asset-tab" data-cat="decoration">装饰</button>
    </div>
    <div id="asset-list"></div>
  </div>
  
  <div id="canvas-area">
    <canvas id="main-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div id="coord-display">X: 0, Y: 0</div>
    <div id="minimap-container">
      <canvas id="minimap-canvas"></canvas>
      <div id="minimap-viewport"></div>
    </div>
    <div id="zoom-controls">
      <button id="zoom-in" title="放大">+</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-out" title="缩小">-</button>
      <button id="zoom-fit" title="适应窗口">⊡</button>
      <button id="zoom-reset" title="重置">♺</button>
    </div>
  </div>
  
  <div id="right-panel">
    <div class="panel-header">属性</div>
    <div id="prop-panel" style="padding:10px;color:#666;font-size:12px;">选择一个对象查看属性</div>
  </div>
</div>

<!-- 新建地图对话框 -->
<div id="new-map-dialog" class="dialog-overlay" style="display:none;">
  <div class="dialog-box">
    <h2>📐 新建地图</h2>
    <div class="dialog-row"><label>名称:</label><input id="new-map-name" type="text" value="新地图"></div>
    <div class="dialog-row"><label>宽度:</label><input id="new-map-width" type="number" value="2000" min="200" max="10000"></div>
    <div class="dialog-row"><label>高度:</label><input id="new-map-height" type="number" value="1200" min="200" max="10000"></div>
    <div class="dialog-row"><label>背景色:</label><input id="new-map-bgcolor" type="text" value="#5dae4a"></div>
    <div class="dialog-btns">
      <button class="dialog-cancel" onclick="hideNewMapDialog()">取消</button>
      <button class="dialog-ok" onclick="confirmNewMap()">创建</button>
    </div>
  </div>
</div>

<script>
// ===== 全局变量 =====
let currentTool = 'select';
let currentMap = null;
let maps = {};
let zoom = 1.0;
let panX = 0, panY = 0;
let isDragging = false;
let isPanning = false;
let lastMX = 0, lastMY = 0;
let showGrid = true;
let snapSize = 8;
let pendingAsset = null;
let selectedIds = new Set();

// 画笔模式状态
let brushAssetKey = null;
let brushTileSize = 128;
let brushAutoTile = true;
let brushActive = false;
let brushPaintedCells = new Set(); // 本次绘制的格子坐标集合,用于优化自动拼接
let brushPreviewX = 0, brushPreviewY = 0; // 画笔预览位置
let brushLastTileX = 0, brushLastTileY = 0; // 上一次绘制位置（路径填充）

// ===== 自动拼接规则引擎 =====
// 4方向位掩码：N=1, S=2, E=4, W=8
// 自动拼接素材组：定义哪些assetKey属于同一组,以及如何替换
const AUTO_TILE_GROUPS = {
  // 道路组：直路、横路、T字路、十字路、弯道
  'road': {
    assets: ['TOWN_ROAD', 'TOWN_ROAD_H', 'TOWN_ROAD_T', 'TOWN_ROAD_CROSS', 'TOWN_ROAD_CURVE'],
    // 位掩码映射：{ assetKey, rotation(顺时针度数) }
    // N=1, S=2, E=4, W=8，旋转值: 0/90/180/270
    // TOWN_ROAD_H: 横路素材(默认水平)，旋转90°即为竖路
    // TOWN_ROAD_T: T字路(默认开口向N)，旋转180°开口向S
    // TOWN_ROAD_CURVE: 弯道(默认NE角)
    bitmaskMap: {
      0:  { key: 'TOWN_ROAD',        rot: 0 },   // 孤立路块
      1:  { key: 'TOWN_ROAD_H',      rot: 90 },  // 仅N → 竖路(横路转90°)
      2:  { key: 'TOWN_ROAD_H',      rot: 90 },  // 仅S → 竖路
      4:  { key: 'TOWN_ROAD_H',      rot: 0 },   // 仅E → 横路
      8:  { key: 'TOWN_ROAD_H',      rot: 0 },   // 仅W → 横路
      3:  { key: 'TOWN_ROAD_H',      rot: 90 },  // N+S → 竖路直通
      12: { key: 'TOWN_ROAD_H',      rot: 0 },   // E+W → 横路直通
      5:  { key: 'TOWN_ROAD_CURVE',  rot: 90 },  // N+E → 弯道NE
      9:  { key: 'TOWN_ROAD_CURVE',  rot: 180 }, // N+W → 弯道NW
      6:  { key: 'TOWN_ROAD_CURVE',  rot: 0 },   // S+E → 弯道SE
      10: { key: 'TOWN_ROAD_CURVE',  rot: 270 }, // S+W → 弯道SW
      // T字路口
      7:  { key: 'TOWN_ROAD_T',      rot: 180 }, // N+S+E → 开口W
      11: { key: 'TOWN_ROAD_T',      rot: 270 }, // N+S+W → 开口E
      13: { key: 'TOWN_ROAD_T',      rot: 0 },   // N+E+W → 开口S
      14: { key: 'TOWN_ROAD_T',      rot: 90 },  // S+E+W → 开口N
      // 十字路口
      15: { key: 'TOWN_ROAD_CROSS',  rot: 0 },   // N+E+S+W
    }
  }
};

// 判断一个assetKey是否属于某个自动拼接组
function getAutoTileGroup(assetKey) {
  for (const [groupName, group] of Object.entries(AUTO_TILE_GROUPS)) {
    if (group.assets.includes(assetKey)) return groupName;
  }
  return null;
}
let undoStack = [];
let redoStack = [];
let currentCat = 'all';
let dragOffX = 0, dragOffY = 0; // 拖拽偏移量

// Canvas
let mainCanvas, mainCtx, overlayCanvas, overlayCtx;
let canvasW = 4000, canvasH = 3000;

// 小地图
let minimapCanvas, minimapCtx, minimapContainer, minimapViewport;

// 图片缓存
const imageCache = {};

// 素材定义（将从assets.json加载）
let ASSETS = {};

// ===== 初始化 =====
async function init() {
  mainCanvas = document.getElementById('main-canvas');
  mainCtx = mainCanvas.getContext('2d');
  overlayCanvas = document.getElementById('overlay-canvas');
  overlayCtx = overlayCanvas.getContext('2d');
  
  // 初始化小地图
  initMinimap();
  
  // 初始化缩放控件
  initZoomControls();
  
  // 加载素材列表
  await loadAssetsFromJSON();
  
  // 创建默认地图
  createNewMap();
  
  // 绑定事件
  bindEvents();
  
  // 预加载图片
  preloadImages();
  
  // 渲染
  render();
  
  // 设置默认工具
  setTool('select');
}

// 从JSON加载素材
async function loadAssetsFromJSON() {
  try {
    const resp = await fetch('/tools/map-editor/assets.json?t=' + Date.now());
    const data = await resp.json();
    
    // 转换为编辑器格式
    const catMap = {
      'town': 'building',
      'npc': 'npc',
      'other': 'decoration'
    };
    
    Object.keys(data.assets).forEach(key => {
      const asset = data.assets[key];
      ASSETS[key] = {
        name: asset.name,
        cat: catMap[asset.category] || 'decoration',
        w: 0,  // 将从图片获取
        h: 0,
        colPad: 0,
        path: asset.path
      };
    });
    
    console.log('已加载 ' + Object.keys(ASSETS).length + ' 个素材');
  } catch (e) {
    console.error('加载素材列表失败:', e);
  }
}

// 预加载图片
function preloadImages() {
  const keys = Object.keys(ASSETS);
  let loaded = 0;
  
  keys.forEach(key => {
    const def = ASSETS[key];
    const img = new Image();
    
    img.onload = function() {
      imageCache[key] = img;
      // 获取实际宽高
      if (def.w === 0 || def.h === 0) {
        def.w = img.width;
        def.h = img.height;
      }
      loaded++;
      if (loaded === keys.length) {
        console.log('所有图片加载完成');
        render();
      }
    };
    
    img.onerror = function() {
      console.warn('加载图片失败:', key);
      loaded++;
    };
    
    // 添加缓存破坏参数，确保加载最新图片
    const separator = def.path.includes('?') ? '&' : '?';
    img.src = def.path + separator + 't=' + Date.now();
  });
}

// 创建新地图（使用对话框让用户设置尺寸）
function createNewMap(customConfig) {
  const id = 'map_' + Date.now();
  const config = customConfig || { width: 2000, height: 1200, bgColor: '#5dae4a' };
  currentMap = {
    id: id,
    name: '新地图',
    config: config,
    objects: [],
    roadZones: []
  };
  maps[id] = currentMap;
  loadAssetPanel();
}

// 加载素材面板
function loadAssetPanel() {
  const list = document.getElementById('asset-list');
  list.innerHTML = '';
  
  const entries = currentCat === 'all' 
    ? Object.entries(ASSETS)
    : Object.entries(ASSETS).filter(([k, v]) => v.cat === currentCat);
  
  entries.forEach(([key, def]) => {
    const item = document.createElement('div');
    item.className = 'asset-item';
    item.dataset.key = key;
    
    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.src = def.path;
    thumb.draggable = false;
    
    const nameEl = document.createElement('div');
    nameEl.className = 'asset-name';
    nameEl.textContent = def.name;
    
    item.appendChild(thumb);
    item.appendChild(nameEl);
    
    // 点击素材
    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      setTool('place');
      pendingAsset = key;
    });
    
    list.appendChild(item);
  });
}

// ===== 事件绑定 =====
function bindEvents() {
  const area = document.getElementById('canvas-area');
  
  overlayCanvas.addEventListener('mousedown', onMouseDown);
  overlayCanvas.addEventListener('mousemove', onMouseMove);
  overlayCanvas.addEventListener('mouseup', onMouseUp);
  overlayCanvas.addEventListener('wheel', onWheel, { passive: false });
  
  document.addEventListener('keydown', onKeyDown);
  
  // 素材标签切换
  document.querySelectorAll('.asset-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.asset-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      loadAssetPanel();
    });
  });
}

function onMouseDown(e) {
  const areaRect = document.getElementById('canvas-area').getBoundingClientRect();
  const mouseX = e.clientX - areaRect.left;
  const mouseY = e.clientY - areaRect.top;
  const x = (mouseX - panX) / zoom;
  const y = (mouseY - panY) / zoom;
  
  if (e.button === 0) {
    if (currentTool === 'select') {
      const obj = hitTest(x, y);
      if (obj) {
        selectObject(obj.id);
        isDragging = true;
        dragOffX = x - obj.x;
        dragOffY = y - obj.y;
      } else {
        clearSelection();
      }
    } else if (currentTool === 'place') {
      if (pendingAsset) {
        placeObject(pendingAsset, Math.round(x), Math.round(y));
      }
    } else if (currentTool === 'brush') {
      // 画笔绘制开始
      if (brushAssetKey) {
        brushActive = true;
        brushPaintedCells.clear();
        const tileX = snapToTile(x, brushTileSize);
        const tileY = snapToTile(y, brushTileSize);
        brushLastTileX = tileX;
        brushLastTileY = tileY;
        // 第一个瓦片：无方向信息，使用默认素材
        paintTileAt(tileX, tileY, 0, 0);
      }
    } else if (currentTool === 'delete') {
      const obj = hitTest(x, y);
      if (obj) deleteObject(obj.id);
    }
  } else if (e.button === 1) {
    isPanning = true;
    lastMX = e.clientX;
    lastMY = e.clientY;
  }
}

function onMouseMove(e) {
  const areaRect = document.getElementById('canvas-area').getBoundingClientRect();
  const mouseX = e.clientX - areaRect.left;
  const mouseY = e.clientY - areaRect.top;
  const x = (mouseX - panX) / zoom;
  const y = (mouseY - panY) / zoom;
  
  // 画笔预览坐标
  if (currentTool === 'brush') {
    const tileX = snapToTile(x, brushTileSize);
    const tileY = snapToTile(y, brushTileSize);
    const hitObj = hitTest(x, y);
    const hitInfo = hitObj ? ' | 命中: ' + hitObj.assetKey : '';
    document.getElementById('coord-display').textContent = 
      '画笔 ' + Math.round(tileX) + ',' + Math.round(tileY) + 
      ' | Tile:' + (tileX / brushTileSize) + ',' + (tileY / brushTileSize) +
      ' | ' + Math.round(zoom * 100) + '%' + hitInfo;
  } else {
    const hitObj = hitTest(x, y);
    const debugInfo = hitObj ? ' | 命中: ' + hitObj.assetKey : '';
    document.getElementById('coord-display').textContent = 
      '屏幕: ' + Math.round(mouseX) + ',' + Math.round(mouseY) + 
      ' 世界: ' + Math.round(x) + ',' + Math.round(y) + 
      ' | 缩放: ' + Math.round(zoom * 100) + '%' + debugInfo;
  }
  
  if (isPanning) {
    panX += e.clientX - lastMX;
    panY += e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;
    updateTransform();
    render();
  } else if (isDragging && selectedIds.size > 0) {
    const selected = getSelectedObjects();
    selected.forEach(obj => {
      obj.x = Math.round(x - dragOffX);
      obj.y = Math.round(y - dragOffY);
    });
    updatePropertyPanel();
    render();
  } else if (brushActive && currentTool === 'brush' && brushAssetKey) {
    // 画笔连续绘制：Bresenham路径填充 + 方向感知（AoE2风格）
    const curX = snapToTile(x, brushTileSize);
    const curY = snapToTile(y, brushTileSize);
    const dx = curX - brushLastTileX;
    const dy = curY - brushLastTileY;
    const steps = Math.max(Math.abs(dx), Math.abs(dy)) / brushTileSize;
    const stepX = dx > 0 ? brushTileSize : (dx < 0 ? -brushTileSize : 0);
    const stepY = dy > 0 ? brushTileSize : (dy < 0 ? -brushTileSize : 0);
    
    // 填充起点到终点之间所有瓦片
    for (let i = 1; i <= steps; i++) {
      const fx = brushLastTileX + stepX * i;
      const fy = brushLastTileY + stepY * i;
      paintTileAt(fx, fy, dx, dy);
    }
    brushLastTileX = curX;
    brushLastTileY = curY;
  }
  
  // 记录画笔预览位置并刷新（非绘制状态）
  if (currentTool === 'brush') {
    brushPreviewX = x;
    brushPreviewY = y;
    if (!brushActive) render();
  }
}

function onMouseUp(e) {
  if (brushActive) {
    brushActive = false;
    // 画笔松开后，运行自动拼接校正
    if (brushAutoTile) {
      runAutoTileCorrection();
    }
    brushPaintedCells.clear();
    render();
  }
  isDragging = false;
  isPanning = false;
}

function onWheel(e) {
  e.preventDefault();
  
  // 修复坐标转换：使用canvas-area的布局位置
  const areaRect = document.getElementById('canvas-area').getBoundingClientRect();
  const mouseX = e.clientX - areaRect.left;
  const mouseY = e.clientY - areaRect.top;
  
  // 计算鼠标在世界坐标中的位置
  const worldX = (mouseX - panX) / zoom;
  const worldY = (mouseY - panY) / zoom;
  
  // 计算缩放因子
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.1, Math.min(5, zoom * delta));
  const zoomRatio = newZoom / zoom;
  
  // 调整pan位置，使鼠标指向的世界坐标保持不变
  panX = mouseX - worldX * newZoom;
  panY = mouseY - worldY * newZoom;
  
  zoom = newZoom;
  
  updateTransform();
  updateZoomDisplay();
  render();
  updateMinimap();
}

// ===== 画笔核心函数 =====

// 在指定瓦片位置放置或更新一个Tile
// 带方向感知的画笔放置（AoE2风格）
// dirX, dirY: 本次拖拽方向（用于确定直路的方向）
function paintTileAt(tileX, tileY, dirX, dirY) {
  if (!currentMap || !brushAssetKey) return;
  
  const tileSize = brushTileSize;
  const cellKey = tileX + '_' + tileY;
  if (brushPaintedCells.has(cellKey)) return;
  brushPaintedCells.add(cellKey);
  
  // 方向感知：根据拖拽方向选择主力素材
  // 横向拖拽 → TOWN_ROAD_H（横路），竖向拖拽 → TOWN_ROAD（竖路）
  const absDX = Math.abs(dirX);
  const absDY = Math.abs(dirY);
  const groupName = getAutoTileGroup(brushAssetKey);
  
  let finalAssetKey = brushAssetKey;
  let rotation = 0;
  
  // 如果属于自动拼接组，先根据方向选初始素材
  if (groupName && (absDX > 0 || absDY > 0)) {
    const group = AUTO_TILE_GROUPS[groupName];
    if (absDX > absDY && absDX >= tileSize) {
      // 水平拖拽 → 横路
      finalAssetKey = 'TOWN_ROAD_H';
      rotation = 0;
    } else if (absDY >= absDX && absDY >= tileSize) {
      // 垂直拖拽 → 竖路（TOWN_ROAD旋转90°）
      finalAssetKey = 'TOWN_ROAD';
      rotation = 90;
    }
  }
  
  // 自动拼接：邻接检测覆盖方向选择
  if (brushAutoTile) {
    const bitmask = calcNeighborBitmask(tileX, tileY, tileSize, brushAssetKey);
    const tileInfo = getTileByBitmask(bitmask, brushAssetKey);
    if (tileInfo) {
      finalAssetKey = tileInfo.key;
      // 如果方向信息已有且mask建议不同的旋转，以mask为准
      rotation = (tileInfo.rot !== undefined) ? tileInfo.rot : rotation;
    }
  }
  
  const def = ASSETS[finalAssetKey];
  if (!def) return;
  
  // 查找是否已有对象
  const existingIndex = currentMap.objects.findIndex(obj => obj.x === tileX && obj.y === tileY);
  
  if (existingIndex >= 0) {
    currentMap.objects[existingIndex].assetKey = finalAssetKey;
    currentMap.objects[existingIndex].rotation = rotation || 0;
    currentMap.objects[existingIndex].w = tileSize || def.w;
    currentMap.objects[existingIndex].h = tileSize || def.h;
    currentMap.objects[existingIndex].type = getTypeFromCat(def.cat);
   } else {
    currentMap.objects.push({
      id: 'tile_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      assetKey: finalAssetKey,
      x: tileX,
      y: tileY,
      w: tileSize || def.w,
      h: tileSize || def.h,
      type: getTypeFromCat(def.cat),
      rotation: rotation || 0,
      layer: 'main'  // 默认图层
    });
  }
  
  render();
}

// 计算4方向邻接位掩码（N=1, S=2, E=4, W=8）
function calcNeighborBitmask(tileX, tileY, tileSize, assetKey) {
  const groupName = getAutoTileGroup(assetKey);
  if (!groupName) return 0;
  
  const group = AUTO_TILE_GROUPS[groupName];
  const directions = [
    { dx: 0, dy: -tileSize, bit: 1 }, // N
    { dx: 0, dy: tileSize,  bit: 2 }, // S
    { dx: tileSize, dy: 0,  bit: 4 }, // E
    { dx: -tileSize, dy: 0, bit: 8 }, // W
  ];
  
  let bitmask = 0;
  for (const dir of directions) {
    const nx = tileX + dir.dx;
    const ny = tileY + dir.dy;
    // 查找该位置是否有同组对象
    const neighbor = currentMap.objects.find(obj => {
      return obj.x === nx && obj.y === ny && group.assets.includes(obj.assetKey);
    });
    if (neighbor) {
      bitmask |= dir.bit;
    }
  }
  
  return bitmask;
}

// 根据位掩码获取对应的瓦片信息
function getTileByBitmask(bitmask, assetKey) {
  const groupName = getAutoTileGroup(assetKey);
  if (!groupName) return null;
  
  const group = AUTO_TILE_GROUPS[groupName];
  return group.bitmaskMap[bitmask] || group.bitmaskMap[0] || null;
}

// 画笔松开后：宽半径自动拼接校正（支持多轮迭代）
function runAutoTileCorrection() {
  if (!currentMap || brushPaintedCells.size === 0) return;
  
  const tileSize = brushTileSize;
  
  // 第1轮：收集所有受影响的格子（绘制区+2层邻居）
  let cellsToFix = new Set(brushPaintedCells);
  
  for (const cellKey of brushPaintedCells) {
    const [cx, cy] = cellKey.split('_').map(Number);
    // 2层邻居范围（确保边缘连接顺畅）
    for (let dy = -2 * tileSize; dy <= 2 * tileSize; dy += tileSize) {
      for (let dx = -2 * tileSize; dx <= 2 * tileSize; dx += tileSize) {
        if (dx === 0 && dy === 0) continue;
        cellsToFix.add((cx + dx) + '_' + (cy + dy));
      }
    }
  }
  
  // 多轮校正（最多3轮，直到收敛）
  const MAX_PASSES = 3;
  for (let pass = 0; pass < MAX_PASSES; pass++) {
    let changed = false;
    const nextRound = new Set();
    
    for (const cellKey of cellsToFix) {
      const [cx, cy] = cellKey.split('_').map(Number);
      const obj = currentMap.objects.find(o => o.x === cx && o.y === cy);
      if (!obj) continue;
      
      const groupName = getAutoTileGroup(obj.assetKey);
      if (!groupName) continue;
      
      const bitmask = calcNeighborBitmask(cx, cy, tileSize, obj.assetKey);
      const tileInfo = getTileByBitmask(bitmask, obj.assetKey);
      if (tileInfo && (obj.assetKey !== tileInfo.key || (obj.rotation || 0) !== (tileInfo.rot || 0))) {
        obj.assetKey = tileInfo.key;
        obj.rotation = tileInfo.rot || 0;
        changed = true;
        
        // 变化的格子周围1层也加入下一轮
        const dirs = [[0, -tileSize], [0, tileSize], [tileSize, 0], [-tileSize, 0]];
        for (const [dx, dy] of dirs) {
          nextRound.add((cx + dx) + '_' + (cy + dy));
        }
      }
    }
    
    if (!changed) break;
    cellsToFix = nextRound;
  }
  
  render();
}

// 画笔预览：在overlay canvas上绘制将要放置的瓦片高亮
function drawBrushPreview(mouseX, mouseY, ctx) {
  if (!brushAssetKey) return;
  const targetCtx = ctx || overlayCtx;
  
  const tileX = snapToTile(mouseX, brushTileSize);
  const tileY = snapToTile(mouseY, brushTileSize);
  
  targetCtx.strokeStyle = '#00ffcc';
  targetCtx.lineWidth = 2 / zoom;
  targetCtx.setLineDash([6 / zoom, 3 / zoom]);
  targetCtx.strokeRect(tileX, tileY, brushTileSize, brushTileSize);
  targetCtx.setLineDash([]);
  
  // 半透明填充预览
  targetCtx.fillStyle = 'rgba(0, 255, 204, 0.15)';
  targetCtx.fillRect(tileX, tileY, brushTileSize, brushTileSize);
}

function onKeyDown(e) {
  if (e.key === 's' || e.key === 'S') setTool('select');
  if (e.key === 'p' || e.key === 'P') setTool('place');
  if (e.key === 'b' || e.key === 'B') setTool('brush');
  if (e.key === 'd' || e.key === 'D') setTool('delete');
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedIds.size > 0) {
      deleteSelected();
    }
  }
  if (e.ctrlKey && e.key === 'z') {
    e.preventDefault();
    undo();
  }
  if (e.ctrlKey && e.key === 'y') {
    e.preventDefault();
    redo();
  }
  if (e.ctrlKey && e.key === 'd') {
    e.preventDefault();
    duplicateSelected();
  }
  // 快捷键缩放
  if (e.key === '=' || e.key === '+') {
    e.preventDefault();
    zoomIn();
  }
  if (e.key === '-') {
    e.preventDefault();
    zoomOut();
  }
  if (e.key === '0') {
    e.preventDefault();
    zoomReset();
  }
}

// ===== 小地图功能 =====
function initMinimap() {
  minimapContainer = document.getElementById('minimap-container');
  minimapCanvas = document.getElementById('minimap-canvas');
  minimapCtx = minimapCanvas.getContext('2d');
  minimapViewport = document.getElementById('minimap-viewport');
  
  // 设置小地图画布尺寸
  minimapCanvas.width = 200;
  minimapCanvas.height = 150;
  
  // 绑定小地图点击事件
  minimapContainer.addEventListener('click', onMinimapClick);
  minimapContainer.addEventListener('mousedown', onMinimapMouseDown);
  minimapContainer.addEventListener('mousemove', onMinimapMouseMove);
  minimapContainer.addEventListener('mouseup', onMinimapMouseUp);
  
  updateMinimap();
}

function updateMinimap() {
  if (!currentMap || !minimapCtx) return;
  
  const ctx = minimapCtx;
  const canvas = minimapCanvas;
  
  // 清空画布
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // 计算缩放比例
  const scaleX = canvas.width / canvasW;
  const scaleY = canvas.height / canvasH;
  const scale = Math.min(scaleX, scaleY);
  
  // 居中偏移
  const offsetX = (canvas.width - canvasW * scale) / 2;
  const offsetY = (canvas.height - canvasH * scale) / 2;
  
  // 绘制地图对象
  currentMap.objects.forEach(obj => {
    const def = ASSETS[obj.assetKey];
    if (!def) return;
    
    // 根据类型选择颜色
    let color = '#666';
    if (def.cat === 'building') color = '#4a90d9';
    else if (def.cat === 'obstacle') color = '#d94a4a';
    else if (def.cat === 'decoration') color = '#4ad94a';
    else if (def.cat === 'npc') color = '#d9d94a';
    
    ctx.fillStyle = color;
    ctx.fillRect(
      offsetX + obj.x * scale,
      offsetY + obj.y * scale,
      Math.max(2, def.w * scale),
      Math.max(2, def.h * scale)
    );
  });
  
  // 更新视口框
  updateMinimapViewport(offsetX, offsetY, scale);
}

function updateMinimapViewport(offsetX, offsetY, scale) {
  if (!minimapViewport) return;
  
  // 获取画布区域的尺寸
  const areaRect = document.getElementById('canvas-area').getBoundingClientRect();
  
  // 计算视口在世界坐标中的范围和位置
  const viewLeft = -panX / zoom;
  const viewTop = -panY / zoom;
  const viewWidth = areaRect.width / zoom;
  const viewHeight = areaRect.height / zoom;
  
  // 转换为小地图坐标
  const vpLeft = offsetX + viewLeft * scale;
  const vpTop = offsetY + viewTop * scale;
  const vpWidth = viewWidth * scale;
  const vpHeight = viewHeight * scale;
  
  // 设置视口框样式
  minimapViewport.style.left = vpLeft + 'px';
  minimapViewport.style.top = vpTop + 'px';
  minimapViewport.style.width = Math.max(2, vpWidth) + 'px';
  minimapViewport.style.height = Math.max(2, vpHeight) + 'px';
  minimapViewport.style.display = 'block';
}

function onMinimapClick(e) {
  if (!currentMap) return;
  
  const rect = minimapContainer.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  
  // 计算小地图缩放比例
  const scaleX = minimapCanvas.width / canvasW;
  const scaleY = minimapCanvas.height / canvasH;
  const scale = Math.min(scaleX, scaleY);
  
  // 居中偏移
  const offsetX = (minimapCanvas.width - canvasW * scale) / 2;
  const offsetY = (minimapCanvas.height - canvasH * scale) / 2;
  
  // 转换为世界坐标
  const worldX = (mx - offsetX) / scale;
  const worldY = (my - offsetY) / scale;
  
  // 居中显示
  const areaRect = document.getElementById('canvas-area').getBoundingClientRect();
  panX = areaRect.width / 2 - worldX * zoom;
  panY = areaRect.height / 2 - worldY * zoom;
  
  updateTransform();
  render();
  updateMinimap();
}

let isDraggingMinimap = false;
function onMinimapMouseDown(e) {
  isDraggingMinimap = true;
  onMinimapClick(e);
}
function onMinimapMouseMove(e) {
  if (isDraggingMinimap) {
    onMinimapClick(e);
  }
}
function onMinimapMouseUp(e) {
  isDraggingMinimap = false;
}

// ===== 缩放控件 =====
function initZoomControls() {
  document.getElementById('zoom-in').addEventListener('click', () => zoomIn());
  document.getElementById('zoom-out').addEventListener('click', () => zoomOut());
  document.getElementById('zoom-fit').addEventListener('click', () => zoomFit());
  document.getElementById('zoom-reset').addEventListener('click', () => zoomReset());
  updateZoomDisplay();
}

function zoomIn() {
  setZoom(zoom * 1.2);
}

function zoomOut() {
  setZoom(zoom * 0.8);
}

function zoomReset() {
  setZoom(1.0);
}

function zoomFit() {
  if (!currentMap) return;
  
  const areaRect = document.getElementById('canvas-area').getBoundingClientRect();
  const scaleX = areaRect.width / canvasW;
  const scaleY = areaRect.height / canvasH;
  const newZoom = Math.min(scaleX, scaleY) * 0.9; // 90%填充
  
  zoom = Math.max(0.1, Math.min(5, newZoom));
  panX = (areaRect.width - canvasW * zoom) / 2;
  panY = (areaRect.height - canvasH * zoom) / 2;
  
  updateTransform();
  updateZoomDisplay();
  render();
  updateMinimap();
}

function setZoom(newZoom) {
  // 以画布中心为锚点缩放
  const areaRect = document.getElementById('canvas-area').getBoundingClientRect();
  const centerX = areaRect.width / 2;
  const centerY = areaRect.height / 2;
  
  const worldX = (centerX - panX) / zoom;
  const worldY = (centerY - panY) / zoom;
  
  zoom = Math.max(0.1, Math.min(5, newZoom));
  
  panX = centerX - worldX * zoom;
  panY = centerY - worldY * zoom;
  
  updateTransform();
  updateZoomDisplay();
  render();
  updateMinimap();
}

function updateZoomDisplay() {
  const el = document.getElementById('zoom-level');
  if (el) {
    el.textContent = Math.round(zoom * 100) + '%';
  }
}

// ===== 工具函数 =====
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('btn-' + tool).classList.add('active');
  
  // 画笔模式：显示画笔面板，填充素材下拉框
  const brushPanel = document.getElementById('brush-panel');
  if (tool === 'brush') {
    if (brushPanel) brushPanel.classList.add('active');
    populateBrushAssets();
    if (!brushAssetKey) {
      // 默认选择第一个素材
      const select = document.getElementById('brush-asset-select');
      if (select && select.options.length > 0) {
        brushAssetKey = select.options[0].value;
      }
    }
    clearSelection();
  } else {
    if (brushPanel) brushPanel.classList.remove('active');
    brushActive = false;
  }
  
  render();
}

// 填充画笔素材下拉框(只显示适合做Tile的素材: building类型)
function populateBrushAssets() {
  const select = document.getElementById('brush-asset-select');
  if (!select) return;
  
  const currentVal = select.value || brushAssetKey;
  select.innerHTML = '';
  
  const entries = Object.entries(ASSETS).sort((a, b) => a[1].name.localeCompare(b[1].name));
  entries.forEach(([key, def]) => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = def.name + ' (' + key + ')';
    select.appendChild(opt);
  });
  
  if (currentVal) select.value = currentVal;
}

// 画笔素材变更
function onBrushAssetChange() {
  brushAssetKey = document.getElementById('brush-asset-select').value;
}

// 瓦片大小变更
function onBrushTileChange() {
  brushTileSize = parseInt(document.getElementById('brush-tile-size').value) || 128;
  brushTileSize = Math.max(32, Math.min(512, brushTileSize));
}

// 自动拼接开关
function onBrushAutoTileChange() {
  brushAutoTile = document.getElementById('brush-auto-tile').checked;
}

function snap(v) {
  return Math.round(v / snapSize) * snapSize;
}

// 吸附到画笔瓦片网格
function snapToTile(v, tileSize) {
  return Math.round(v / tileSize) * tileSize;
}

function hitTest(x, y) {
  if (!currentMap) return null;
  // 按图层从上到下检测（fg先命中）
  const layerOrder = { fg: 3, main: 2, road: 1, bg: 0 };
  const getLayerVal = (obj) => {
    const l = (obj.layer || 'main');
    return layerOrder[l] !== undefined ? layerOrder[l] : 2;
  };
  const byLayer = [...currentMap.objects].sort((a, b) =>
    getLayerVal(b) - getLayerVal(a)
  );
  for (const obj of byLayer) {
    const w = obj.w || 0;
    const h = obj.h || 0;
    if (x >= obj.x && x <= obj.x + w && y >= obj.y && y <= obj.y + h) {
      return obj;
    }
  }
  return null;
}

function selectObject(id) {
  selectedIds.clear();
  selectedIds.add(id);
  updatePropertyPanel();
  render();
}

function clearSelection() {
  selectedIds.clear();
  updatePropertyPanel();
  render();
}

function getSelectedObjects() {
  if (!currentMap) return [];
  return currentMap.objects.filter(obj => selectedIds.has(obj.id));
}

function placeObject(key, x, y) {
  if (!currentMap) return;
  
  const def = ASSETS[key];
  if (!def) return;
  
  // 根据类型设置默认碰撞属性
  const objType = getTypeFromCat(def.cat);
  let collisionPadding = 0;
  // 建筑物和障碍物默认有碰撞
  if (objType === 'building' || objType === 'obstacle') {
    collisionPadding = 5; // 默认5像素的内缩
  }
  
  const obj = {
    id: 'obj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    assetKey: key,
    x: x,
    y: y,
    w: def.w,
    h: def.h,
    type: objType,
    collisionPadding: collisionPadding
  };
  
  currentMap.objects.push(obj);
  saveUndo();
  render();
}

function deleteObject(id) {
  if (!currentMap) return;
  currentMap.objects = currentMap.objects.filter(obj => obj.id !== id);
  selectedIds.delete(id);
  saveUndo();
  render();
}

function deleteSelected() {
  if (!currentMap) return;
  currentMap.objects = currentMap.objects.filter(obj => !selectedIds.has(obj.id));
  selectedIds.clear();
  saveUndo();
  render();
}

function duplicateSelected() {
  if (!currentMap || selectedIds.size === 0) return;
  
  const newIds = [];
  const offset = currentTool === 'brush' ? brushTileSize : 20; // 画笔模式下按瓦片偏移
  
  selectedIds.forEach(oldId => {
    const src = currentMap.objects.find(o => o.id === oldId);
    if (!src) return;
    
    const clone = Object.assign({}, src, {
      id: 'obj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      x: src.x + offset,
      y: src.y + offset
    });
    currentMap.objects.push(clone);
    newIds.push(clone.id);
  });
  
  // 选中新复制的对象
  selectedIds.clear();
  newIds.forEach(id => selectedIds.add(id));
  
  saveUndo();
  render();
  updatePropertyPanel();
}

function getTypeFromCat(cat) {
  if (cat === 'building') return 'building';
  if (cat === 'obstacle') return 'obstacle';
  return 'decoration';
}

// ===== 渲染 =====
function render() {
  if (!currentMap) return;
  
  // 只在地图变化时更新画布尺寸
  if (canvasW !== currentMap.config.width || canvasH !== currentMap.config.height) {
    canvasW = currentMap.config.width;
    canvasH = currentMap.config.height;
    mainCanvas.width = canvasW;
    mainCanvas.height = canvasH;
    overlayCanvas.width = canvasW;
    overlayCanvas.height = canvasH;
  }
  
  // 清空画布
  mainCtx.clearRect(0, 0, canvasW, canvasH);
  overlayCtx.clearRect(0, 0, canvasW, canvasH);
  
  // 绿色背景
  mainCtx.fillStyle = currentMap.config.bgColor || '#5dae4a';
  mainCtx.fillRect(0, 0, canvasW, canvasH);
  
  // 网格
  if (showGrid) drawGrid();
  
  // 绘制对象（按图层顺序：bg → road → main → fg）
  // 碰撞区域跟随对应对象绘制，而不是统一盖在最上层
  const layerOrder = { bg: 0, road: 1, main: 2, fg: 3 };
  const getLayerVal = (obj) => {
    const l = (obj.layer || 'main');
    return layerOrder[l] !== undefined ? layerOrder[l] : 2;
  };
  const sorted = [...currentMap.objects].sort((a, b) => getLayerVal(a) - getLayerVal(b));
  sorted.forEach(obj => {
    drawObject(obj);
    // 碰撞区域紧跟在对应对象之后绘制，不会盖住上层对象的图片
    drawCollisionZone(obj);
  });
  
  // 绘制选中框
  selectedIds.forEach(id => {
    const obj = currentMap.objects.find(o => o.id === id);
    if (obj) drawSelection(obj);
  });
  
  updateTransform();
  updateMinimap();
  
  // 画笔模式：在overlay上绘制预览高亮
  if (currentTool === 'brush' && brushAssetKey && !brushActive) {
    drawBrushPreview(brushPreviewX, brushPreviewY, overlayCtx);
  }
}

function drawGrid() {
  mainCtx.strokeStyle = 'rgba(255,255,255,0.1)';
  mainCtx.lineWidth = 1;
  
  for (let x = 0; x <= canvasW; x += snapSize) {
    mainCtx.beginPath();
    mainCtx.moveTo(x, 0);
    mainCtx.lineTo(x, canvasH);
    mainCtx.stroke();
  }
  for (let y = 0; y <= canvasH; y += snapSize) {
    mainCtx.beginPath();
    mainCtx.moveTo(0, y);
    mainCtx.lineTo(canvasW, y);
    mainCtx.stroke();
  }
}

function drawObject(obj) {
  const def = ASSETS[obj.assetKey];
  if (!def) return;
  
  const w = obj.w || def.w || 0;
  const h = obj.h || def.h || 0;
  const rot = obj.rotation || 0;
  
  const img = imageCache[obj.assetKey];
  
  if (rot !== 0 && img) {
    // 旋转绘制：绕瓦片中心旋转
    mainCtx.save();
    const cx = obj.x + w / 2;
    const cy = obj.y + h / 2;
    mainCtx.translate(cx, cy);
    mainCtx.rotate(rot * Math.PI / 180);
    mainCtx.drawImage(img, -w / 2, -h / 2, w, h);
    mainCtx.restore();
  } else if (img) {
    mainCtx.drawImage(img, obj.x, obj.y, w, h);
  } else {
    mainCtx.fillStyle = '#666';
    mainCtx.fillRect(obj.x, obj.y, w, h);
    mainCtx.fillStyle = '#fff';
    mainCtx.font = '12px sans-serif';
    mainCtx.fillText(def.name, obj.x + 5, obj.y + 20);
  }
}

function drawSelection(obj) {
  overlayCtx.strokeStyle = '#e94560';
  overlayCtx.lineWidth = 2;
  overlayCtx.strokeRect(obj.x, obj.y, obj.w, obj.h);
  
  // 控制点
  overlayCtx.fillStyle = '#e94560';
  overlayCtx.fillRect(obj.x - 3, obj.y - 3, 6, 6);
  overlayCtx.fillRect(obj.x + obj.w - 3, obj.y - 3, 6, 6);
  overlayCtx.fillRect(obj.x - 3, obj.y + obj.h - 3, 6, 6);
  overlayCtx.fillRect(obj.x + obj.w - 3, obj.y + obj.h - 3, 6, 6);
}

// 绘制碰撞区域可视化
function drawCollisionZone(obj) {
  // 只有建筑物和障碍物才有碰撞
  if (obj.type !== 'building' && obj.type !== 'obstacle') return;
  
  const pad = obj.collisionPadding || 0;
  let collX, collY, collW, collH;
  
  // 根据对象类型计算碰撞区域（与 town-scene.js 中的逻辑一致）
  if (obj.assetKey === 'TOWN_TREE') {
    // 树：碰撞只覆盖树干部位（底部18%高度×42%宽度）
    collH = Math.max(14, obj.h * 0.18);
    collW = Math.max(23, obj.w * 0.42);
    collX = obj.x + (obj.w - collW) / 2;
    collY = obj.y + obj.h - collH;
  } else if (obj.assetKey === 'TOWN_FOREST') {
    // 森林：碰撞 = 最底部树根区（20%高度×45%宽度）
    collH = Math.max(22, obj.h * 0.20);
    collW = Math.max(28, obj.w * 0.45);
    collX = obj.x + (obj.w - collW) / 2;
    collY = obj.y + obj.h - collH;
  } else if (obj.assetKey === 'TOWN_ROCK') {
    // 石块：碰撞 = 底部 55%
    collH = Math.max(15, obj.h * 0.55);
    collW = Math.max(18, obj.w * 0.60);
    collX = obj.x + (obj.w - collW) / 2;
    collY = obj.y + obj.h - collH;
  } else {
    // 默认：全高全宽，向内收缩 collisionPadding
    collW = obj.w - pad * 2;
    collH = obj.h - pad * 2;
    collX = obj.x + pad;
    collY = obj.y + pad;
  }
  
  // 绘制半透明红色填充
  overlayCtx.fillStyle = 'rgba(255, 0, 0, 0.2)';
  overlayCtx.fillRect(collX, collY, collW, collH);
  
  // 绘制红色虚线边框
  overlayCtx.strokeStyle = 'rgba(255, 0, 0, 0.6)';
  overlayCtx.lineWidth = 1;
  overlayCtx.setLineDash([5, 3]);
  overlayCtx.strokeRect(collX, collY, collW, collH);
  overlayCtx.setLineDash([]); // 重置虚线
  
  // 在碰撞区域中心显示 "COL" 标识
  overlayCtx.fillStyle = 'rgba(255, 0, 0, 0.8)';
  overlayCtx.font = '10px sans-serif';
  overlayCtx.textAlign = 'center';
  overlayCtx.textBaseline = 'middle';
  overlayCtx.fillText('COL', collX + collW / 2, collY + collH / 2);
  overlayCtx.textAlign = 'start';
  overlayCtx.textBaseline = 'alphabetic';
}

function updateTransform() {
  mainCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  overlayCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

// ===== 撤销/重做 =====
function saveUndo() {
  undoStack.push(JSON.stringify(currentMap.objects));
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(JSON.stringify(currentMap.objects));
  currentMap.objects = JSON.parse(undoStack.pop());
  render();
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(JSON.stringify(currentMap.objects));
  currentMap.objects = JSON.parse(redoStack.pop());
  render();
}

// ===== 导入/导出 =====
function loadJSFile(input) {
  const file = input.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    parseAndLoadJS(text);
    input.value = '';
  };
  reader.readAsText(file);
}

// ===== 通用地图解析（自动检测所有变量名，无需硬编码） =====
function parseAndLoadJS(text) {
  try {
    currentMap._rawContent = text;
    
    // 1. 扫描所有 export const/let/var 变量名
    const exportNames = [];
    const exportRE = /export\s+(const|let|var)\s+(\w+)\s*=/g;
    let m;
    while ((m = exportRE.exec(text)) !== null) {
      if (!exportNames.includes(m[2])) exportNames.push(m[2]);
    }
    
    // 2. 执行代码，获取所有导出变量
    const code = text.replace(/export\s+/g, '');
    const returnParts = exportNames.map(name => 
      JSON.stringify(name) + ': typeof ' + name + ' !== "undefined" ? ' + name + ' : null'
    );
    const returnCode = code + ';\nreturn {' + returnParts.join(',\n') + '};';
    const fn = new Function(returnCode);
    const result = fn();
    
    // 3. 自动检测：哪种变量是地图对象列表
    let objectsVarName = null, objects = null;
    let configVarName = null, config = null;
    let enumName = null;
    let roadZonesVarName = null, roadZones = null;
    let npcVarName = null, npcPositions = null;
    let spawnVarName = null, spawnPoint = null;
    
    for (const [name, value] of Object.entries(result)) {
      if (!value || name.startsWith('_')) continue;
      
      // 检测地图对象数组（包含 x/y/assetKey 的数组）
      if (Array.isArray(value) && value.length > 0 && typeof value[0] === 'object') {
        const first = value[0];
        if (first.assetKey !== undefined) {
          objectsVarName = name;
          objects = value;
        } else if (first.type !== undefined) {
          roadZonesVarName = name;
          roadZones = value;
        }
        continue;
      }
      
      // 检测普通对象
      if (typeof value === 'object' && !Array.isArray(value)) {
        const keys = Object.keys(value);
        const vals = Object.values(value);
        
        // 配置对象：有 width/height，不是枚举
        if (value.width !== undefined && value.height !== undefined && value.DECORATION === undefined) {
          configVarName = name;
          config = value;
          continue;
        }
        
        // 类型枚举：值都是字符串（如 'obstacle', 'decoration'）
        const allStrVals = vals.every(v => typeof v === 'string');
        if (allStrVals && vals.length >= 2) {
          enumName = name;
          continue;
        }
        
        // NPC位置：键映射到 {x,y} 对象
        const allXY = vals.every(v => typeof v === 'object' && v !== null && v.x !== undefined && v.y !== undefined);
        if (allXY && vals.length >= 1) {
          npcVarName = name;
          npcPositions = value;
          continue;
        }
        
        // 出生点：刚好有 x,y 两个属性
        if (keys.length <= 3 && value.x !== undefined && value.y !== undefined) {
          spawnVarName = name;
          spawnPoint = value;
          continue;
        }
      }
    }
    
    // 4. 如果自动检测失败，兜底尝试常见命名模式
    if (!objects) {
      for (const [name, value] of Object.entries(result)) {
        if (Array.isArray(value) && value.length > 0) {
          objectsVarName = name;
          objects = value;
          break;
        }
      }
    }
    
    if (objects && objects.length > 0) {
      const editorObjects = objects.map(obj => {
        const w = obj.width || obj.w || 64;
        const h = obj.height || obj.h || 64;
        return {
          id: obj.id || ('obj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5)),
          x: obj.x || 0, y: obj.y || 0,
          w: w, h: h,
          type: obj.type || 'obstacle',
          assetKey: obj.assetKey || '',
          collisionPadding: obj.collisionPadding || 0,
          rotation: obj.rotation || 0,
          npcId: obj.npcId || '',
          layer: obj.layer || 'main'
        };
      });
      
      const invalidKeys = [];
      editorObjects.forEach(obj => {
        if (!obj.assetKey || !ASSETS[obj.assetKey]) invalidKeys.push(obj.assetKey || '(空)');
      });
      if (invalidKeys.length > 0) {
        alert('警告：发现 ' + invalidKeys.length + ' 个对象的 assetKey 无效！');
      }
      
      currentMap.objects = editorObjects.filter(obj => obj);
      
      // ★ 保存元数据（变量名），供导出时精准替换
      currentMap._importedData = {
        objectsVarName: objectsVarName,
        configVarName: configVarName, config: config,
        enumName: enumName,
        roadZonesVarName: roadZonesVarName, roadZones: roadZones,
        npcVarName: npcVarName, npcPositions: npcPositions,
        spawnVarName: spawnVarName, spawnPoint: spawnPoint
      };
      currentMap.name = objectsVarName ? objectsVarName.replace(/_MAP_OBJECTS$/i, '').replace(/_/g, ' ') : 'Imported Map';
      
      if (config) {
        currentMap.config.width = config.width || 2000;
        currentMap.config.height = config.height || 1200;
        currentMap.config.bgColor = config.bgColor || '#4a8c3f';
      }
      
      render();
      alert('成功导入 ' + editorObjects.length + ' 个对象！\n检测到: ' + objectsVarName + (enumName ? ', 枚举: ' + enumName : ''));
    } else {
      alert('未能解析出地图对象。\n请确保文件中有 export 的对象数组（包含 x/y/assetKey）。');
    }
  } catch (e) {
    console.error('解析失败:', e);
    alert('解析失败: ' + e.message);
  }
}

// ===== 智能导出辅助函数 =====

/**
 * 生成地图对象数组的代码（将type字符串转换为MAP_OBJ_TYPE引用）
 * 精确保留 MAP_OBJ_TYPE.XXXX 引用格式
 */
function _genObjectsCode(objects, objTypeEnum) {
  const enumPrefix = objTypeEnum || 'MAP_OBJ_TYPE';
  const typeMap = {
    'building': 'BUILDING',
    'obstacle': 'OBSTACLE',
    'decoration': 'DECORATION',
    'road': 'ROAD',
    'npc_spot': 'NPC_SPOT'
  };
  let code = '';
  objects.forEach(obj => {
    if (!obj) return;
    const w = obj.w || obj.width || 64;
    const h = obj.h || obj.height || 64;
    const typeConst = typeMap[obj.type] || 'OBSTACLE';
    // 使用正确的枚举名：grassland→GLAND_OBJ_TYPE, town→MAP_OBJ_TYPE
    code += '  { type: ' + enumPrefix + '.' + typeConst
           + ', x: ' + (obj.x || 0) + ', y: ' + (obj.y || 0)
           + ', width: ' + w + ', height: ' + h
           + ', w: ' + w + ', h: ' + h
           + ", assetKey: '" + (obj.assetKey || '') + "'";
    if (obj.collisionPadding) code += ', collisionPadding: ' + obj.collisionPadding;
    if (obj.rotation) code += ', rotation: ' + obj.rotation;
    if (obj.npcId) code += ", npcId: '" + obj.npcId + "'";
    if (obj.layer && obj.layer !== 'main') code += ", layer: '" + obj.layer + "'";
    code += ' },\n';
  });
  return code;
}

/**
 * 在原始JS文件中智能替换地图对象数组，保留所有注释和结构
 * 返回替换后的完整文件内容，失败返回null
 */
function _smartReplace(rawContent, objectsCode, objectsVarName) {
  // 智能替换：只替换指定变量名对应的数组内容
  const startIdx = rawContent.indexOf('export const ' + objectsVarName + ' = [');
  if (startIdx === -1) {
    // 尝试 let/var
    const altIdx = rawContent.indexOf('export var ' + objectsVarName + ' = [');
    if (altIdx === -1) return null;
    return _smartReplaceInner(rawContent, objectsCode, altIdx);
  }
  return _smartReplaceInner(rawContent, objectsCode, startIdx);
}

function _smartReplaceInner(rawContent, objectsCode, startIdx) {
  // 找到数组开始括号 
  const bracketIdx = rawContent.indexOf('[', startIdx);
  if (bracketIdx === -1) return null;
  // 匹配括号找到对应结束位置（正确处理字符串和注释）
  let depth = 0;
  let inStr = false, strCh = '', esc = false;
  let endIdx = -1;
  for (let i = bracketIdx; i < rawContent.length; i++) {
    const ch = rawContent[i];
    if (esc) { esc = false; continue; }
    if (inStr) {
      if (ch === '\\') { esc = true; continue; }
      if (ch === strCh) inStr = false;
      continue;
    }
    if (ch === '"' || ch === "'") { inStr = true; strCh = ch; continue; }
    // 跳过行注释
    if (ch === '/' && rawContent[i+1] === '/') {
      while (i < rawContent.length && rawContent[i] !== '\n') i++;
      continue;
    }
    // 跳过多行注释
    if (ch === '/' && rawContent[i+1] === '*') {
      i += 2;
      while (i < rawContent.length && !(rawContent[i] === '*' && rawContent[i+1] === '/')) i++;
      i++;
      continue;
    }
    if (ch === '[') depth++;
    if (ch === ']') { depth--; if (depth === 0) { endIdx = i; break; } }
  }
  if (endIdx === -1) return null;
  // 拼接：保留数组前面的内容 + 新对象列表 + 数组结尾
  return rawContent.substring(0, bracketIdx + 1) + '\n' + objectsCode + rawContent.substring(endIdx);
}

/**
 * 复制文本到剪贴板
 */
function _copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      alert('代码已复制到剪贴板！\n\n已精确保留原文件所有注释和结构。\n请直接粘贴覆盖原文件。');
    }).catch(() => {
      _fallbackCopy(text);
    });
  } else {
    _fallbackCopy(text);
  }
}
function _fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  alert('代码已复制到剪贴板！\n\n已精确保留原文件所有注释和结构。\n请直接粘贴覆盖原文件。');
}

// ===== 导出函数 =====
function exportJS() {
  if (!currentMap) return;
  
  // 校验所有对象是否有效
  const invalidObjects = [];
  const nullObjects = [];
  
  currentMap.objects.forEach((obj, index) => {
    // 检查是否为 null 或 undefined
    if (!obj) {
      nullObjects.push(index);
      return;
    }
    
    // 检查 assetKey 是否有效
    if (!obj.assetKey || obj.assetKey === '' || !ASSETS[obj.assetKey]) {
      invalidObjects.push({ index, obj });
    }
  });
  
  // 移除 null/undefined 对象
  if (nullObjects.length > 0) {
    console.warn('移除 ' + nullObjects.length + ' 个无效对象（null/undefined）');
    currentMap.objects = currentMap.objects.filter(obj => obj);
  }
  
  if (invalidObjects.length > 0) {
    const msg = '警告：发现 ' + invalidObjects.length + ' 个对象的 assetKey 无效！\n\n' +
                '这些对象可能导致游戏报错。\n\n' +
                '是否继续导出？\n（建议先修复无效的 assetKey）';
    if (!confirm(msg)) {
      return; // 用户选择取消
    }
  }
  
  
  // 如果有原始文件内容，使用智能替换（保留所有注释和结构）
  if (currentMap._rawContent && currentMap._importedData?.objectsVarName) {
    const meta = currentMap._importedData;
    const objTypeEnum = meta.enumName || 'MAP_OBJ_TYPE';
    const newCode = _genObjectsCode(currentMap.objects, objTypeEnum);
    
    // 使用智能替换（传入对象变量名而非 mapType）
    const result = _smartReplace(currentMap._rawContent, newCode, meta.objectsVarName);
    
    if (result) {
      // 复制到剪贴板
      _copyToClipboard(result);
      return;
    }
  }
  
  // 降级方案：生成完整文件（如果没有原始文件内容）
  const name = currentMap.name.toUpperCase().replace(/[^A-Z0-9]/g, '_');
  const prefix = name.includes('TOWN') ? 'TOWN' : (name.includes('GRASSLAND') ? 'GRASSLAND' : 'MAP');
  
  let code = '/**\n';
  code += ' * ' + currentMap.name + ' - 地图数据定义\n';
  code += ' * \n';
  code += ' * 由地图编辑器生成于：' + new Date().toLocaleString() + '\n';
  code += ' * 请保留此文件顶部的注释\n';
  code += ' */\n\n';
  
  // 导出地图配置
  code += '// ========== 地图配置 ==========\n';
  code += 'export const ' + prefix + '_MAP_CONFIG = {\n';
  code += '  width: ' + currentMap.config.width + ',\n';
  code += '  height: ' + currentMap.config.height + ',\n';
  code += '  bgColor: \'' + (currentMap.config.bgColor || '#5dae4a') + '\',\n';
  code += '};\n\n';
  
  // 导出地图对象
  code += '// ========== 地图对象 ==========\n';
  code += 'export const ' + prefix + '_MAP_OBJECTS = [\n';
  
  currentMap.objects.forEach(obj => {
    // 确保 obj 存在
    if (!obj) return;
    
    const def = ASSETS[obj.assetKey] || {};
    const w = obj.w || obj.width || def.w || 64;  // 默认 64，防止 undefined
    const h = obj.h || obj.height || def.h || 64;
    const type = obj.type || 'obstacle';
    
    code += '  {\n';
    code += '    type: \'' + type + '\',\n';
    code += '    id: \'' + (obj.id || ('obj_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5))) + '\',\n';
    code += '    x: ' + (obj.x || 0) + ', y: ' + (obj.y || 0) + ',\n';
    code += '    width: ' + w + ', height: ' + h + ',\n';
    code += '    assetKey: \'' + (obj.assetKey || '') + '\',\n';

    // 可选字段
    if (obj.collisionPadding) {
      code += '    collisionPadding: ' + obj.collisionPadding + ',\n';
    }
    if (obj.npcId) {
      code += '    npcId: \'' + obj.npcId + '\',\n';
    }
    if (obj.rotation) {
      code += '    rotation: ' + obj.rotation + ',\n';
    }
    if (obj.layer && obj.layer !== 'main') {
      code += '    layer: \'' + obj.layer + '\',\n';
    }

    code += '  },\n';
  });
  
  code += '];\n';
  
  // 导出道路区域（如果有）
  if (currentMap.roadZones && currentMap.roadZones.length > 0) {
    code += '\n// ========== 道路区域 ==========\n';
    code += '// 程序化道路区域数据\n';
    code += '// 每个区域是一个矩形，使用对应素材填充\n';
    code += 'export const ' + prefix + '_ROAD_ZONES = ' + JSON.stringify(currentMap.roadZones, null, 2) + ';\n';
  }
  
  // 复制到剪贴板
  navigator.clipboard.writeText(code).then(() => {
    alert('代码已复制到剪贴板！\n\n请粘贴到对应的JS文件中，覆盖原有内容。\n\n提示：已添加详细注释，请根据实际情况调整。');
  }).catch(() => {
    // 降级方案
    const textarea = document.createElement('textarea');
    textarea.value = code;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    alert('代码已复制到剪贴板！\n\n请粘贴到对应的JS文件中，覆盖原有内容。\n\n提示：已添加详细注释，请根据实际情况调整。');
  });
}

// ===== 公共API =====
const Editor = {};
Editor.newMap = createNewMap;
Editor.newMapDialog = showNewMapDialog;
Editor.setTool = setTool;
Editor.toggleGrid = function() { showGrid = !showGrid; render(); };
Editor.undo = undo;
Editor.redo = redo;
Editor.exportJS = exportJS;
Editor.loadJSFile = loadJSFile;
Editor.deleteSelected = deleteSelected;
Editor.duplicateSelected = duplicateSelected;
Editor.rescanAssets = function() {
  const confirmed = confirm(
    '重新扫描素材需要执行以下步骤：\n\n' +
    '1. 在命令行运行：npm run scan-assets\n' +
    '2. 点击"确定"后，编辑器将自动刷新\n\n' +
    '是否已运行扫描脚本？'
  );
  
  if (confirmed) {
    // 强制刷新页面，清除所有缓存
    window.location.reload(true);
  }
};
Editor.onPropChange = function(prop, value) {
  const selected = getSelectedObjects();
  if (selected.length === 0) return;
  
  selected.forEach(obj => {
    if (prop === 'x' || prop === 'y' || prop === 'w' || prop === 'h' || prop === 'rotation' || prop === 'collisionPadding') {
      obj[prop] = parseInt(value) || 0;
    } else {
      obj[prop] = value;
    }
  });
  
  render();
};

// 地图属性变更处理
Editor.onMapPropChange = function(prop, value) {
  if (!currentMap) return;
  
  if (prop === 'width' || prop === 'height') {
    const newVal = parseInt(value) || 2000;
    currentMap.config[prop] = Math.max(200, Math.min(10000, newVal)); // 限制范围200-10000
    
    // 调整画布尺寸并重新渲染
    canvasW = currentMap.config.width;
    canvasH = currentMap.config.height;
    mainCanvas.width = canvasW;
    mainCanvas.height = canvasH;
    overlayCanvas.width = canvasW;
    overlayCanvas.height = canvasH;
  } else {
    currentMap.config[prop] = value;
    if (prop === 'name') {
      currentMap.name = value;
    }
  }
  
  render();
  updatePropertyPanel();
};

// ===== 新建地图对话框 =====
function showNewMapDialog() {
  const dialog = document.getElementById('new-map-dialog');
  if (dialog) {
    // 预填默认值
    document.getElementById('new-map-name').value = '新地图';
    document.getElementById('new-map-width').value = 2000;
    document.getElementById('new-map-height').value = 1200;
    document.getElementById('new-map-bgcolor').value = '#5dae4a';
    dialog.style.display = 'flex';
    // 自动聚焦到名称输入框
    setTimeout(() => document.getElementById('new-map-name').focus(), 100);
  }
}

function hideNewMapDialog() {
  const dialog = document.getElementById('new-map-dialog');
  if (dialog) dialog.style.display = 'none';
}

function confirmNewMap() {
  const name = document.getElementById('new-map-name').value.trim() || '新地图';
  const width = parseInt(document.getElementById('new-map-width').value) || 2000;
  const height = parseInt(document.getElementById('new-map-height').value) || 1200;
  const bgColor = document.getElementById('new-map-bgcolor').value || '#5dae4a';
  
  // 范围限制
  const safeW = Math.max(200, Math.min(10000, width));
  const safeH = Math.max(200, Math.min(10000, height));
  
  createNewMap({ width: safeW, height: safeH, bgColor: bgColor });
  
  // 更新画布尺寸
  canvasW = safeW;
  canvasH = safeH;
  mainCanvas.width = canvasW;
  mainCanvas.height = canvasH;
  overlayCanvas.width = canvasW;
  overlayCanvas.height = canvasH;
  
  hideNewMapDialog();
  clearSelection();
  render();
}

// ===== 填充背景功能 =====
Editor.fillBackgroundDialog = function() {
  if (!currentMap) {
    alert('请先新建或打开一个地图！');
    return;
  }

  // 创建对话框
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.id = 'fill-bg-dialog';

  let html = '<div class="dialog-box">';
  html += '<h2>🌾 填充地图背景</h2>';

  // 选择素材
  html += '<div class="dialog-row">';
  html += '<label>选择素材:</label>';
  html += '<select id="fill-bg-asset" style="flex:1;padding:6px 10px;background:#2a2a4a;border:1px solid #444;border-radius:4px;color:#e0e0e0;font-size:13px;">';

  // 获取所有town类别的素材（根据 key 前缀判断，排除特殊对象）
  const excludeKeys = ['TOWN_ROAD', 'TOWN_SHOP', 'TOWN_WEAPON_SHOP'];
  const townAssets = Object.entries(ASSETS).filter(([key, asset]) => {
    return key.startsWith('TOWN_') && !excludeKeys.includes(key);
  });

  if (townAssets.length === 0) {
    html += '<option value="">无可用素材</option>';
  } else {
    townAssets.forEach(([key, asset]) => {
      const selected = key === 'TOWN_BACKGROUNDGRASS' ? ' selected' : '';
      html += '<option value="' + key + '"' + selected + '>' + (asset.name || key) + '</option>';
    });
  }

  html += '</select>';
  html += '</div>';

  // 瓦片大小
  html += '<div class="dialog-row">';
  html += '<label>瓦片大小:</label>';
  html += '<input type="number" id="fill-bg-tile-size" value="64" min="32" max="256" style="flex:1;">';
  html += '</div>';

  // 图层
  html += '<div class="dialog-row">';
  html += '<label>图层:</label>';
  html += '<select id="fill-bg-layer" style="flex:1;padding:6px 10px;background:#2a2a4a;border:1px solid #444;border-radius:4px;color:#e0e0e0;font-size:13px;">';
  html += '<option value="bg" selected>🏔️ 背景层 (最底)</option>';
  html += '<option value="road">🛤️ 道路层</option>';
  html += '<option value="main">🏠 主层</option>';
  html += '<option value="fg">🌿 前景层 (最顶)</option>';
  html += '</select>';
  html += '</div>';

  // 提示
  html += '<div style="font-size:11px;color:#aaa;margin:10px 0;padding:8px;background:#1a1a2e;border-radius:4px;">';
  html += '💡 这将会：<br>';
  html += '1. 删除该图层的所有现有对象<br>';
  html += '2. 用选定素材铺满整个地图';
  html += '</div>';

  html += '<div class="dialog-btns">';
  html += '<button class="dialog-ok" onclick="Editor.doFillBackground()">填充</button>';
  html += '<button class="dialog-cancel" onclick="document.getElementById(\'fill-bg-dialog\').remove()">取消</button>';
  html += '</div>';

  html += '</div>';
  overlay.innerHTML = html;

  document.body.appendChild(overlay);
};

Editor.doFillBackground = function() {
  const assetKey = document.getElementById('fill-bg-asset').value;
  const tileSize = parseInt(document.getElementById('fill-bg-tile-size').value) || 64;
  const layer = document.getElementById('fill-bg-layer').value;

  if (!assetKey) {
    alert('请选择素材！');
    return;
  }

  const mapW = currentMap.config.width;
  const mapH = currentMap.config.height;

  // 1. 删除该图层的所有现有对象
  currentMap.objects = currentMap.objects.filter(obj => obj.layer !== layer);

  // 2. 计算需要铺多少瓦片
  const cols = Math.ceil(mapW / tileSize);
  const rows = Math.ceil(mapH / tileSize);

  // 3. 铺满地图
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const x = col * tileSize;
      const y = row * tileSize;

      // 确保不超出地图边界
      if (x < mapW && y < mapH) {
        currentMap.objects.push({
          id: 'bg_' + Date.now() + '_' + col + '_' + row,
          assetKey: assetKey,
          x: x,
          y: y,
          w: tileSize,
          h: tileSize,
          type: 'decoration',
          rotation: 0,
          collisionPadding: 0,
          layer: layer
        });
      }
    }
  }

  // 4. 保存撤销状态并重新渲染
  saveUndo();
  render();

  // 5. 关闭对话框
  const dialog = document.getElementById('fill-bg-dialog');
  if (dialog) dialog.remove();

  alert('✅ 已填充背景！\n共放置 ' + (cols * rows) + ' 个瓦片');
};
